spring.application.name=mensageria

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Cada consumidor pega uma mensagem por vez (fair dispatch). O backlog fica na fila
# como "Ready" e pode ser acompanhado pelo Management.
spring.rabbitmq.listener.simple.prefetch=1

# Retry dos consumidores: 3 tentativas com backoff (1s, 2s).
# Esgotadas as tentativas, a mensagem é rejeitada sem requeue e vai para a DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Cada falha de consumidor já é registrada numa linha pelo recuperador (RabbitMQConfig) e pela DLQ.
# Sem isso o Spring repete a mesma falha com um stack trace enorme no log.
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler=ERROR

# Recusa "quantidade": 1.5 em vez de truncar silenciosamente para 1
spring.jackson.deserialization.accept-float-as-int=false

# Banco H2 em memória (console em http://localhost:8080/h2-console, JDBC URL jdbc:h2:mem:pedidos)
spring.datasource.url=jdbc:h2:mem:pedidos
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Simulação do pagamento
pagamento.tempo-processamento-ms=1000
# Pedidos acima desse valor simulam o gateway de pagamento fora do ar (falha transitória)
pagamento.limite-gateway=10000

# false = mensagens ficam acumuladas na pedido.dlq para inspeção pelo Management
dlq.consumer.auto-startup=true
